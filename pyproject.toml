[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "work-work-loop"
version = "1.1.0"
description = "Phase CLI for the Work Work Loop kernel."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Logan Smith" }]
keywords = ["work-work-loop"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
wwl-phase = "wwl_phase.__main__:main"

[tool.setuptools.packages.find]
include = ["wwl_phase*"]
exclude = ["tests*", "engine*"]
